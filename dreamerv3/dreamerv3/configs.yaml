defaults:

  seed: 1
  method: name
  task: dummy_disc
  logdir: /dev/null
  replay: uniform
  replay_size: 1e6
  replay_online: False
  eval_dir: ''
  filter: '.*'
  tensorboard: True

  jax:
    platform: gpu
    jit: True
    precision: float16
    prealloc: True
    debug_nans: False
    logical_cpus: 0
    debug: False
    policy_devices: [0]
    train_devices: [0]
    metrics_every: 10

  run:
    script: train
    steps: 1e10
    expl_until: 0
    log_every: 60
    save_every: 300
    eval_every: 1e6
    eval_initial: True
    eval_eps: 1
    eval_samples: 1
    train_ratio: 32.0
    train_fill: 0
    count_prefill_steps: True
    eval_fill: 0
    log_zeros: False
    log_keys_video: [image]
    log_keys_sum: '^$'
    log_keys_mean: '(log_entropy)'
    log_keys_max: '^$'
    from_checkpoint: ''
    from_checkpoint_mode: full
    demo_dir: ''
    demo_limit_steps: 0
    demo_sampling: chronological
    sync_every: 1
    # actor_addr: 'tcp://127.0.0.1:5551'
    actor_addr: 'ipc:///tmp/5552'
    actor_batch: 32

  envs: {amount: 4, parallel: process, length: 0, reset: True, restart: True, discretize: 0, checks: False}
  wrapper: {length: 0, reset: True, discretize: 0, checks: False}
  env:
    atari: {size: [64, 64], repeat: 4, sticky: True, gray: False, actions: all, lives: unused, noops: 0, resize: opencv}
    dmlab: {size: [64, 64], repeat: 4, episodic: True}
    minecraft: {size: [64, 64], break_speed: 100.0}
    dmc: {size: [64, 64], repeat: 2, camera: -1}
    loconav: {size: [64, 64], repeat: 2, camera: -1}
    tagmaze: {randomize_plant: False, random_start: False, start_progress_min: 0.0, start_progress_max: 0.85, start_lateral_range_m: 0.002, start_velocity_range_mps: 0.0, progress_forward_window_m: 0.035, progress_backward_window_m: 0.080, clearance_warning_m: 0.005, reward_mode: scaled_progress, progress_reward_scale: 10.0, success_bonus: 10.0, failure_penalty: 5.0, action_rate_penalty: 0.0, hole_warning_m: 0.008, hole_clearance_penalty: 0.0, maze_manifest: '', maze_split: '', maze_sampling: uniform, curriculum_episodes: 5000, plr_uniform_mix: 0.25, plr_staleness_mix: 0.15, plr_ema: 0.10, start_curriculum: False, start_curriculum_initial_min: 0.80, start_curriculum_expand_step: 0.10, start_curriculum_window: 40, start_curriculum_success_threshold: 0.70, full_start_probability: 0.20, randomization_curriculum: False, randomization_initial_strength: 0.0, randomization_expand_step: 0.10, randomization_max_strength: 1.0, randomization_window: 50, randomization_success_threshold: 0.60, randomization_groups: all}

  # Agent
  task_behavior: Greedy
  expl_behavior: None
  batch_size: 16
  batch_length: 64
  data_loaders: 8

  # World Model
  grad_heads: [decoder, reward, cont]
  rssm: {deter: 4096, units: 1024, stoch: 32, classes: 32, act: silu, norm: layer, initial: learned, unimix: 0.01, unroll: False, action_clip: 1.0, winit: normal, fan: avg}
  encoder: {mlp_keys: '.*', cnn_keys: '.*', act: silu, norm: layer, mlp_layers: 5, mlp_units: 1024, cnn: resnet, cnn_depth: 96, cnn_blocks: 0, resize: stride, winit: normal, fan: avg, symlog_inputs: True, minres: 4}
  decoder: {mlp_keys: '.*', cnn_keys: '.*', act: silu, norm: layer, mlp_layers: 5, mlp_units: 1024, cnn: resnet, cnn_depth: 96, cnn_blocks: 0, image_dist: mse, vector_dist: symlog_mse, inputs: [deter, stoch], resize: stride, winit: normal, fan: avg, outscale: 1.0, minres: 4, cnn_sigmoid: False}
  reward_head: {layers: 5, units: 1024, act: silu, norm: layer, dist: symlog_disc, outscale: 0.0, outnorm: False, inputs: [deter, stoch], winit: normal, fan: avg, bins: 255}
  cont_head: {layers: 5, units: 1024, act: silu, norm: layer, dist: binary, outscale: 1.0, outnorm: False, inputs: [deter, stoch], winit: normal, fan: avg}
  loss_scales: {image: 1.0, vector: 1.0, reward: 1.0, cont: 1.0, dyn: 0.5, rep: 0.1, actor: 1.0, critic: 1.0, slowreg: 1.0}
  dyn_loss: {impl: kl, free: 1.0}
  rep_loss: {impl: kl, free: 1.0}
  model_opt: {opt: adam, lr: 1e-4, eps: 1e-8, clip: 1000.0, wd: 0.0, warmup: 0, lateclip: 0.0}

  # Actor Critic
  actor: {layers: 5, units: 1024, act: silu, norm: layer, minstd: 0.1, maxstd: 1.0, outscale: 1.0, outnorm: False, unimix: 0.01, inputs: [deter, stoch], winit: normal, fan: avg, symlog_inputs: False}
  critic: {layers: 5, units: 1024, act: silu, norm: layer, dist: symlog_disc, outscale: 0.0, outnorm: False, inputs: [deter, stoch], winit: normal, fan: avg, bins: 255, symlog_inputs: False}
  actor_opt: {opt: adam, lr: 3e-5, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 0, lateclip: 0.0}
  critic_opt: {opt: adam, lr: 3e-5, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 0, lateclip: 0.0}
  actor_dist_disc: onehot
  actor_dist_cont: normal
  actor_grad_disc: reinforce
  actor_grad_cont: backprop
  critic_type: vfunction
  imag_horizon: 15
  imag_unroll: False
  horizon: 333
  return_lambda: 0.95
  critic_slowreg: logprob
  slow_critic_update: 1
  slow_critic_fraction: 0.02
  retnorm: {impl: perc_ema, decay: 0.99, max: 1.0, perclo: 5.0, perchi: 95.0}
  actent: 3e-4

  # Exploration
  expl_rewards: {extr: 1.0, disag: 0.1}
  expl_opt: {opt: adam, lr: 1e-4, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 0}
  disag_head: {layers: 5, units: 1024, act: silu, norm: layer, dist: mse, outscale: 1.0, inputs: [deter, stoch, action], winit: normal, fan: avg}
  disag_target: [stoch]
  disag_models: 8

tag_sim:
  task: tagmaze_sim
  tensorboard: False
  envs.amount: 1
  envs.parallel: none
  replay: uniform
  jax:
    logical_cpus: 8
  run:
    script: train
    train_ratio: 32
    actor_batch: 1
    save_every: 10
    log_keys_sum: '^log_(reward|fall_cost|success)$'
    log_keys_mean: '^log_(progress|cross_track_error|clearance_cost|min_clearance|maze_difficulty)$'
  env.tagmaze:
    randomize_plant: False
    random_start: False
    reward_mode: scaled_progress
    progress_reward_scale: 10.0
    success_bonus: 10.0
    failure_penalty: 5.0
    maze_manifest: tag_mujoco/maze_splits.json
    maze_split: train
    maze_sampling: curriculum
    curriculum_episodes: 5000
  encoder: {mlp_keys: '^(states|goal)$', cnn_keys: '^image$'}
  decoder: {mlp_keys: '^(states|goal)$', cnn_keys: '^image$'}
  wrapper: {length: 3000}

# Adaptive multi-maze profile. This remains checkpoint/replay incompatible with
# the original 40-maze run and must always use a fresh log directory.
tag_sim_v2:
  task: tagmaze_sim
  tensorboard: False
  envs.amount: 8
  envs.parallel: process
  replay: uniform
  jax:
    logical_cpus: 16
  run:
    script: train
    train_ratio: 32
    actor_batch: 8
    save_every: 10
    demo_dir: ''
    demo_limit_steps: 0
    log_keys_sum: '^log_(reward|fall_cost|success)$'
    log_keys_mean: '^log_(progress|cross_track_error|clearance_cost|min_clearance|maze_difficulty|start_progress|randomization_strength|action_rate|hole_cost|path_cost|wall_cost|dr_.*)$'
  env.tagmaze:
    randomize_plant: True
    random_start: True
    reward_mode: scaled_progress
    progress_reward_scale: 10.0
    success_bonus: 10.0
    failure_penalty: 10.0
    maze_manifest: tag_mujoco/maze_splits_v2.json
    maze_split: train
    maze_sampling: plr
    curriculum_episodes: 5000
    plr_uniform_mix: 0.25
    plr_staleness_mix: 0.15
    plr_ema: 0.10
    start_progress_min: 0.0
    start_progress_max: 0.90
    start_lateral_range_m: 0.002
    start_velocity_range_mps: 0.015
    start_curriculum: True
    start_curriculum_initial_min: 0.75
    start_curriculum_expand_step: 0.10
    start_curriculum_window: 40
    start_curriculum_success_threshold: 0.70
    full_start_probability: 0.20
    randomization_curriculum: True
    randomization_initial_strength: 0.0
    randomization_expand_step: 0.10
    randomization_window: 50
    randomization_success_threshold: 0.60
  encoder: {mlp_keys: '^(states|goal)$', cnn_keys: '^image$'}
  decoder: {mlp_keys: '^(states|goal)$', cnn_keys: '^image$'}
  wrapper: {length: 3000}

# Continuation profile for a mature v2 policy. It removes easier mid-route
# starts and exposes every episode to the full plant-randomization range.
tag_sim_v2_fullstart_finetune:
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: True
    randomization_curriculum: False

# Nominal-first continuation for proving full-route task mastery before domain
# randomization. The launcher requires agent-only loading so the new run starts
# at step zero with a fresh replay buffer containing only nominal transitions.
tag_sim_v2_nominal_fullstart:
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: False
    randomization_curriculum: False

# Nominal continuation A/B arms. The 500k nominal pilot plateaued at 82.8%
# canonical completion and 90.7% mean maximum route completion, short of the
# 90%/95% mastery gate, with per-layout success churning between milestones.
# Each arm changes exactly one thing against tag_sim_v2_nominal_fullstart so the
# dev-split comparison attributes any difference to that change.

# Arm A: double the gradient updates per environment step. The run is
# environment-bound with eight parallel workers, so this buys optimization
# without changing the data distribution.
tag_sim_v2_nominal_ratio64:
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: False
    randomization_curriculum: False
  run.train_ratio: 64

# Arm B: weight falling more heavily than reaching the goal. Falls are 10.9%
# against a 10% ceiling. This is a bounded step, not a large penalty, because
# over-penalizing falls converts them into stalled time-limit episodes, which
# the same evaluation already shows four of.
tag_sim_v2_nominal_fallpenalty:
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: False
    randomization_curriculum: False
    failure_penalty: 14.0

# Arm C: concentrate prioritized level replay on unsolved training layouts.
# Failures are idiosyncratic per layout rather than explained by difficulty
# band, so spreading a quarter of sampling mass uniformly wastes it.
tag_sim_v2_nominal_sharp_plr:
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: False
    randomization_curriculum: False
    plr_uniform_mix: 0.10
    plr_ema: 0.20

# Arm D: charge the policy for slamming the board. Every 192-episode failure
# landed at a route turn in its own 95th percentile or above, while the failure
# points had 9-20 mm of hole clearance and normal wall clearance. The policy is
# bang-bang there (mean |action| 0.90 of full range, saturated on about 70% of
# steps, step-to-step changes of 0.5-1.2), which cannot decelerate into a
# near-right-angle corner. A rate penalty lets it modulate instead.
#
# Calibration matters more than the idea here. A full route earns
# progress_reward_scale (10) plus success_bonus (10), and the 500k policy
# averaged 16.2 return over roughly 750 steps with a mean step-to-step action
# change near 0.57. At 0.003 the smoothness term costs about 1.3 per episode,
# near 6% of the return: enough to shape the control style, small enough that
# standing still stays far worse than finishing. An order of magnitude higher
# would exceed the entire return and simply teach the policy to stop moving.
tag_sim_v2_nominal_smooth:
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: False
    randomization_curriculum: False
    action_rate_penalty: 0.003

# Arm E: give hazard avoidance a dense signal. Until now the only hole-related
# reward was the terminal failure_penalty, charged after the ball had already
# fallen. The margin that decides an episode is about a centimetre, and the
# layouts that never succeed have holes a median 9.6 mm from their sharp turns
# against 12.1 mm for the layouts that always succeed, so the policy needs to
# learn to steer away from a rim it can currently only discover by falling in.
#
# The band is hole-only on purpose. Wall contact is not a failure and normal
# corridor travel runs within a few millimetres of a wall, so the pre-existing
# wall-inclusive clearance_cost would have penalized ordinary driving.
#
# Calibration: cost per step is at most 1, and an 8 mm band covers 0.94% of
# on-route travel, so a well-driven 750-step episode pays well under 0.2 against
# a 20-point return, while sustained drift toward a rim costs a few points.
tag_sim_v2_nominal_holeaware:
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: False
    randomization_curriculum: False
    hole_clearance_penalty: 0.02

# Arm F: both control-side fixes together. Smoothness lets the policy modulate
# tilt, hole awareness tells it which direction the margin matters in.
tag_sim_v2_nominal_smooth_holeaware:
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: False
    randomization_curriculum: False
    action_rate_penalty: 0.003
    hole_clearance_penalty: 0.02

# Conservative continuation of an already competent hole-aware policy. The
# source checkpoint is loaded before replay prefill, optimizer state is reset,
# and the source policy collects the new half of a 50k warm buffer without
# consuming the fine-tuning step budget. The launcher supplies 25k retained
# source-replay transitions for a balanced old/new starting distribution.
tag_sim_v2_nominal_safe_resume:
  jax:
    precision: float32
    debug_nans: False
  run:
    train_ratio: 8
    train_fill: 50000
    count_prefill_steps: False
    demo_sampling: uniform_chunks
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: False
    randomization_curriculum: False
    hole_clearance_penalty: 0.02
  model_opt: {opt: adam, lr: 3e-5, eps: 1e-8, clip: 1000.0, wd: 0.0, warmup: 100, lateclip: 0.0}
  actor_opt: {opt: adam, lr: 3e-6, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 100, lateclip: 0.0}
  critic_opt: {opt: adam, lr: 3e-6, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 100, lateclip: 0.0}

# Skill stage A: teach the warm-started policy to track the planned safe path
# without relying on walls as rails. The terms are intentionally gentle: route
# progress remains the main reward, while path and wall costs shape style.
tag_sim_v2_safe_path_tracking:
  jax:
    precision: float32
    debug_nans: False
  run:
    train_ratio: 8
    train_fill: 50000
    count_prefill_steps: False
    demo_sampling: uniform_chunks
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: False
    randomization_curriculum: False
    hole_clearance_penalty: 0.02
    path_tracking_tolerance_m: 0.004
    path_tracking_penalty: 0.20
    wall_warning_m: 0.003
    wall_riding_penalty: 0.05
    action_rate_penalty: 0.001
  model_opt: {opt: adam, lr: 3e-5, eps: 1e-8, clip: 1000.0, wd: 0.0, warmup: 100, lateclip: 0.0}
  actor_opt: {opt: adam, lr: 3e-6, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 100, lateclip: 0.0}
  critic_opt: {opt: adam, lr: 3e-6, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 100, lateclip: 0.0}

# Skill stage B: single-path route-hazard dodge mazes. The maze manifest
# supplies a replanned safe path that bends around holes near the original
# centerline, while blocker holes stop wrong branches.
tag_sim_v2_easy_dodge_holes:
  jax:
    precision: float32
    debug_nans: False
  run:
    train_ratio: 8
    train_fill: 50000
    count_prefill_steps: False
    demo_sampling: uniform_chunks
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: False
    randomization_curriculum: False
    maze_manifest: tag_mujoco/generated_dodge_mazes/maze_splits_dodge.json
    maze_split: train
    maze_sampling: plr
    hole_warning_m: 0.010
    hole_clearance_penalty: 0.05
    path_tracking_tolerance_m: 0.005
    path_tracking_penalty: 0.15
    wall_warning_m: 0.003
    wall_riding_penalty: 0.05
    action_rate_penalty: 0.001
  model_opt: {opt: adam, lr: 3e-5, eps: 1e-8, clip: 1000.0, wd: 0.0, warmup: 100, lateclip: 0.0}
  actor_opt: {opt: adam, lr: 3e-6, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 100, lateclip: 0.0}
  critic_opt: {opt: adam, lr: 3e-6, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 100, lateclip: 0.0}

# Numerical trainability gate for checkpoint continuation. The launcher sets a
# 2k counted-step limit and supplies the champion checkpoint and source replay.
# Float32 deliberately removes mixed-precision scaling from the first
# diagnosis; all replay and optimizer fail-closed checks remain active.
tag_sim_v2_clean_smoke:
  jax:
    precision: float32
    debug_nans: False
  run:
    train_ratio: 8
    train_fill: 50000
    count_prefill_steps: False
    demo_sampling: uniform_chunks
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: False
    randomization_curriculum: False
    hole_clearance_penalty: 0.02
  model_opt: {opt: adam, lr: 3e-5, eps: 1e-8, clip: 1000.0, wd: 0.0, warmup: 100, lateclip: 0.0}
  actor_opt: {opt: adam, lr: 3e-6, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 100, lateclip: 0.0}
  critic_opt: {opt: adam, lr: 3e-6, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 100, lateclip: 0.0}

# First post-mastery domain-randomization stage. Strength remains fixed at
# 0.10 for the entire bounded run; expansion is deliberately disabled.
tag_sim_v2_holeaware_dr010:
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: True
    randomization_curriculum: True
    randomization_initial_strength: 0.10
    randomization_expand_step: 0.0
    randomization_window: 50
    randomization_success_threshold: 1.0
    hole_clearance_penalty: 0.02

# Historical process-local curriculum retained only to reproduce the invalid
# v3 experiment. Do not use it for new training: an eight-worker 100-episode
# local window cannot advance in a bounded run. New DR stages are explicit,
# checkpoint-gated fixed-strength runs documented in the attribution design.
tag_sim_v2_holeaware_curriculum_dr:
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: True
    randomization_groups: all
    randomization_curriculum: True
    randomization_initial_strength: 0.05
    randomization_expand_step: 0.05
    randomization_max_strength: 0.25
    randomization_window: 100
    randomization_success_threshold: 0.75
    hole_clearance_penalty: 0.02
  run:
    train_ratio: 8
    train_fill: 50000
    count_prefill_steps: False
    demo_sampling: uniform_chunks
  model_opt: {opt: adam, lr: 3e-5, eps: 1e-8, clip: 1000.0, wd: 0.0, warmup: 100, lateclip: 0.0}
  actor_opt: {opt: adam, lr: 3e-6, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 100, lateclip: 0.0}
  critic_opt: {opt: adam, lr: 3e-6, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 100, lateclip: 0.0}

# Full-route continuation that increases dynamics variation only when each
# environment worker demonstrates enough recent success at its current level.
tag_sim_v2_fullstart_staged_randomization:
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: True
    randomization_curriculum: True
    randomization_initial_strength: 0.25
    randomization_expand_step: 0.25
    randomization_window: 15
    randomization_success_threshold: 0.30

# Bounded PLA adaptation. The launcher enforces agent-only checkpoint loading,
# a fresh replay buffer, full-route starts, and staged plant randomization.
tag_sim_v2_pla_adaptation:
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: True
    randomization_curriculum: True
    randomization_initial_strength: 0.25
    randomization_expand_step: 0.25
    randomization_window: 15
    randomization_success_threshold: 0.30

# Matched scratch control for the PLA adaptation experiment.
tag_sim_v2_pla_scratch:
  env.tagmaze:
    random_start: False
    start_curriculum: False
    randomize_plant: True
    randomization_curriculum: True
    randomization_initial_strength: 0.25
    randomization_expand_step: 0.25
    randomization_window: 15
    randomization_success_threshold: 0.30

# Real TAG hardware over the TCP bridge. This profile is kept separate from
# `tag_sim`, which is the multi-maze MuJoCo training environment.
tag:
  task: gym_tag_dreamer:tag-ros-v0
  tensorboard: True
  envs.amount: 1
  envs.parallel: none
  replay: tag
  jax:
    logical_cpus: 8
  run:
    script: train
    train_ratio: 128
    actor_batch: 1
    save_every: 10
    log_keys_sum: '^log_reward$'
  encoder: {mlp_keys: '^(states|goal)$', cnn_keys: '^image$'}
  decoder: {mlp_keys: '^(states|goal)$', cnn_keys: '^image$'}
  wrapper: {length: 3000}

minecraft:

  task: minecraft_diamond
  envs.amount: 16
  run:
    script: train_save
    eval_fill: 1e5
    train_ratio: 16
    log_keys_max: '^log_inventory.*'
  encoder: {mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath|reward', cnn_keys: 'image'}
  decoder: {mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath', cnn_keys: 'image'}

dmlab:

  task: dmlab_explore_goal_locations_small
  envs.amount: 8
  encoder: {mlp_keys: '$^', cnn_keys: 'image'}
  decoder: {mlp_keys: '$^', cnn_keys: 'image'}
  run.train_ratio: 64

atari:

  task: atari_pong
  envs.amount: 8
  run:
    steps: 5.5e7
    eval_eps: 10
    train_ratio: 64
  encoder: {mlp_keys: '$^', cnn_keys: 'image'}
  decoder: {mlp_keys: '$^', cnn_keys: 'image'}

atari100k:

  task: atari_pong
  envs: {amount: 1}
  env.atari: {gray: False, repeat: 4, sticky: False, noops: 30, actions: needed}
  run:
    script: train_eval
    steps: 1.5e5
    eval_every: 1e5
    eval_initial: False
    eval_eps: 100
    train_ratio: 1024
  jax.precision: float32
  rssm.deter: 512
  .*\.cnn_depth: 32
  .*\.layers: 2
  .*\.units$: 512
  actor_eval_sample: True
